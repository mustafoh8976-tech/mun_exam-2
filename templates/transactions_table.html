{% if items %}
<div class="table-responsive">
    <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
            <tr>
                <th>Дата</th>
                <th>Категория</th>
                <th>Сумма</th>
                <th>Описание</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {% for item in items %}
            <tr>
                <td>{{ item.created_at|date:"d.m.Y" }}</td>
                <td>{{ item.get_category_display }}</td>
                <td class="fw-bold">{{ item.amount }}</td>
                <td>{{ item.description|default:"—"|truncatechars:30 }}</td>
                <td class="text-end text-nowrap">
                    <a href="{% url update_url item.pk %}" class="btn btn-outline-primary btn-sm">Изменить</a>
                    <a href="{% url delete_url item.pk %}" class="btn btn-outline-danger btn-sm">Удалить</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% else %}
<p class="text-muted text-center p-4 mb-0">Пока записей нет</p>
{% endif %}
